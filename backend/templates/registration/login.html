<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f9">
  <title>薪火电商 · 登录</title>
  <link rel="icon" type="image/png" href="{% static 'backoffice/favicon.png' %}?v=2">
  <link rel="apple-touch-icon" href="{% static 'backoffice/favicon.png' %}?v=2">
  <link rel="stylesheet" href="{% static 'backoffice/vendor/element-plus.css' %}?v=42">
  <link rel="stylesheet" href="{% static 'backoffice/backoffice.css' %}?v=42">
</head>
<body class="bb-login-body">
  <div id="bb-login-app" class="bb-login-wrap" v-cloak>
    <el-card class="bb-login-card" shadow="hover">
      <form method="post" class="bb-login-form" v-pre>
        {% csrf_token %}
        <div class="bb-login-brand">
          <img class="bb-login-mark" src="{% static 'backoffice/favicon.png' %}?v=2" alt="" width="48" height="48" />
          <div class="bb-login-brand-text">薪火电商</div>
        </div>
        <h1>管理后台登录</h1>
        <p class="bb-login-hint">登录后 12 小时内有效 · 与职员端同一品牌</p>
        {% if form.non_field_errors %}
        <div class="bb-login-errors">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="bb-field">
          <label for="id_username">用户名</label>
          {{ form.username }}
        </div>
        <div class="bb-field">
          <label for="id_password">密码</label>
          {{ form.password }}
        </div>
        <div class="bb-actions">
          <button type="submit" class="bb-btn bb-btn-primary bb-login-submit">登录</button>
        </div>
      </form>
    </el-card>
  </div>
  <script src="{% static 'backoffice/vendor/vue.global.prod.js' %}?v=42"></script>
  <script src="{% static 'backoffice/vendor/element-plus.full.min.js' %}?v=42"></script>
  <script>
    (function () {
      var VueGlobal = window.Vue;
      var ElementPlus = window.ElementPlus;
      if (!VueGlobal || !ElementPlus) return;
      var app = VueGlobal.createApp({
        delimiters: ["[[", "]]"],
      });
      app.use(ElementPlus);
      app.mount("#bb-login-app");
    })();
  </script>
</body>
</html>

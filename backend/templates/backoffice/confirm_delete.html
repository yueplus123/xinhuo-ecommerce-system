{% extends "backoffice/base.html" %}
{% block page_title %}删除{{ title }}{% endblock %}
{% block page_subtitle %}<p class="bb-subtitle">确认删除后无法恢复。</p>{% endblock %}
{% block content %}
<form method="post" class="bb-card el-card is-never-shadow bb-confirm-card">
  {% csrf_token %}
  <div class="bb-confirm-body">
    <p class="bb-confirm-text">确定删除 <strong>{{ object_label }}</strong> 吗？</p>
  </div>
  <div class="bb-actions">
    <button type="submit" class="bb-btn bb-btn-danger">确认删除</button>
    <a class="bb-btn" href="{{ cancel_url }}">取消</a>
  </div>
</form>
{% endblock %}

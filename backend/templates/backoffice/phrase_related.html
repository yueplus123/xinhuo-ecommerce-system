{% if object %}
<section class="bb-subcard">
  <div class="bb-subhead">
    <h2>快捷语管理</h2>
    <a class="bb-btn bb-btn-primary" href="{% url 'backoffice:phrase_add' %}?sku_id={{ object.id }}">新增快捷语</a>
  </div>
  <div class="bb-table-wrap">
    <table class="bb-table">
      <thead><tr><th>排序</th><th>内容</th></tr></thead>
      <tbody>
        {% for phrase in object.quick_phrases.all %}
        <tr><td>{{ phrase.order }}</td><td>{{ phrase.content }}</td></tr>
        {% empty %}
        <tr><td colspan="2">暂无快捷语</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endif %}

{% if object %}
<section class="bb-subcard">
  <div class="bb-subhead">
    <h2>SKU管理</h2>
    <a class="bb-btn bb-btn-primary" href="{% url 'backoffice:sku_add' %}?business_id={{ object.id }}">新增SKU</a>
  </div>
  <div class="bb-table-wrap">
    <table class="bb-table">
      <thead><tr><th>SKU名称</th><th>状态</th><th>价格</th><th>快捷语数</th></tr></thead>
      <tbody>
        {% for sku in object.skus.all %}
        <tr><td>{{ sku.name }}</td><td>{{ sku.get_status_display }}</td><td>{{ sku.price|default:"—" }}</td><td>{{ sku.quick_phrases.count }}</td></tr>
        {% empty %}
        <tr><td colspan="4">暂无SKU</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endif %}

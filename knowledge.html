<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教程+话术 - 薪火</title>
<style>
:root{
  /* 星巴克配色：主绿 #00704A、深绿 #1E3932、浅绿 #D4E9E2、金色 #CBA258、米白底 */
  --g:#00704A; --g-ink:#1E3932; --g-soft:#D4E9E2; --gold:#CBA258; --gold-soft:#F4ECDD; --gold-ink:#7A5A1E;
  --bg:#F2F0EB; --card:#FFF; --ink:#1E2522; --ink2:#3F4945; --muted:#5F6B66; --faint:#86918C;
  --line:#E6E2DA; --line2:#D3CEC4; --soft:#F7F5F0; --red:#C45656; --red-soft:#FBECEC; --blue:#3B6EA8; --blue-soft:#E1EBF6;
}
html.dark{
  color-scheme:dark;
  --g:#2FA37A; --g-ink:#A7E3C9; --g-soft:#173A2E; --gold-soft:#2E2717; --gold-ink:#E2C48A;
  --bg:#0E1714; --card:#16211D; --ink:#E7EEEA; --ink2:#C3CEC9; --muted:#9BA8A2; --faint:#7E8B85;
  --line:#26342F; --line2:#34453E; --soft:#1C2925; --red:#E07A7A; --red-soft:#3A1F1F; --blue:#6FA0D8; --blue-soft:#18283A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--g)}
.hidden{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);min-width:0}
.top{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top h1{margin:0 4px 0 0;font-size:20px}
.sbox{flex:1 1 280px;display:flex;align-items:center;gap:8px;height:42px;border:2px solid var(--g);border-radius:999px;padding:0 14px;background:var(--card);min-width:0}
.sbox input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.sbox .x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--faint);padding:0 2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--soft);color:var(--ink2);white-space:nowrap}
@media (max-width:640px){ .sbox .kbd{display:none} }
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E3932;font-weight:600}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.danger{color:var(--red)}
.spacer{flex:1}
.sub{font-size:13px;color:var(--muted)}
.faint{color:var(--faint)}

.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.side{padding:8px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:6px}
.side input{flex:none;height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--card);font-size:13px;width:100%;outline:none}
.side input:focus{border-color:var(--g)}
.plist{overflow:auto;display:flex;flex-direction:column;gap:2px}
.plist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:8px;min-height:36px;padding:0 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.plist button:hover{background:var(--soft)}
.plist button.on{background:var(--g-soft);color:var(--g-ink);font-weight:700}
.plist button.none{color:var(--faint)}
.plist button small{margin-left:auto;color:var(--faint);font-weight:400;font-size:12px}
.plist button .off{font-size:11px;color:var(--red);font-weight:400}
.plist .sep{font-size:12px;color:var(--faint);padding:8px 10px 2px}
@media (max-width:820px){
  .lay{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .plist{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .plist button{width:auto;flex:none;border:1px solid var(--line2);border-radius:999px;min-height:34px}
  .plist .sep{display:none}
}

.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{padding:14px;display:flex;flex-direction:column;gap:12px}
.ph .tt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab b{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted)}
.tab.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.tab.on b{background:rgba(255,255,255,.22);color:#fff}

.list{display:flex;flex-direction:column;gap:10px}
.it{padding:14px;display:flex;flex-direction:column;gap:8px}
.it .hd{display:flex;gap:8px;align-items:flex-start}
.it .pf{margin-left:auto;flex:none;font-size:17px;font-weight:700;color:var(--red);white-space:nowrap;line-height:1.3}
.it .q{font-size:15px;font-weight:700;line-height:1.5;flex:1;min-width:0;overflow-wrap:anywhere}
.it .q .qm{color:var(--g);font-weight:800;margin-right:6px}
.it .body{white-space:pre-wrap;font-size:14px;line-height:1.7;background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--ink2);overflow-wrap:anywhere}
.it .url{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .meta{font-size:12px;color:var(--faint)}
.it.tut{border-left:4px solid var(--blue)}
.it .desc{font-size:13px;color:var(--muted);line-height:1.5}
.it .body.clamp{max-height:7.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{border:none;background:none;color:var(--g);font-size:13px;cursor:pointer;padding:0;align-self:flex-start}
.att{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.att .lb{font-size:12px;color:var(--faint)}
.att a{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--blue-soft);color:var(--blue);text-decoration:none;border:1px solid transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att a:hover{border-color:var(--blue)}
.used{font-size:12px;color:var(--faint)}
.tpick{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.tpick label{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 6px;border-radius:6px;cursor:pointer}
.tpick label:hover{background:var(--soft)}
.fld .tpick input{width:18px;padding:0;height:18px;flex:none;margin:0}
.it .body a{word-break:break-all}
.it.phr{border-left:4px solid var(--gold)}
.it.faq{border-left:4px solid var(--g)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.k-faq{background:var(--g-soft);color:var(--g-ink)}
.k-tutorial{background:var(--blue-soft);color:var(--blue)}
.k-phrase{background:var(--gold-soft);color:var(--gold-ink)}
.ptag{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--soft);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.grp{font-size:13px;font-weight:700;color:var(--muted);padding:4px 2px}

.mask{position:fixed;inset:0;background:rgba(30,57,50,.45);backdrop-filter:blur(3px);z-index:60}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:16px;z-index:61;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
@media (max-width:640px){ .modal{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:18px 18px 0 0;max-height:92vh} }
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid var(--gold)}
.mh h3{margin:0;font-size:17px}
.mx{width:40px;height:40px;border:none;background:none;font-size:22px;cursor:pointer;border-radius:8px;color:var(--ink2)}
.mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--card);font-size:14px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g)}
.fld textarea{height:160px;padding:10px;line-height:1.6;resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow .fld{flex:1;min-width:150px}
.err{color:var(--red);font-size:13px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:10px;z-index:90;font-size:15px;pointer-events:none;max-width:86vw;text-align:center}
.notice{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <input id="q" type="hidden" value=""><button id="qx" class="hidden"></button><button id="addBtn" class="hidden"></button>
  <div id="app"><div class="card notice">加载中…</div></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
// ================= 深色 / 浅色：跟随职员端 =================
(function(){
  var root=document.documentElement;
  function fromParent(){ try{ if (window.parent!==window && window.parent.document) return window.parent.document.documentElement.classList.contains('dark'); }catch(e){} return null; }
  function fromPref(){ var s=null; try{ s=localStorage.getItem('xinhuo-theme'); }catch(e){} return s==='dark' || (s!=='light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)); }
  function apply(){ var p=fromParent(); root.classList.toggle('dark', p===null?fromPref():p); }
  apply();
  try{ var ph=window.parent!==window && window.parent.document && window.parent.document.documentElement; if (ph) new MutationObserver(apply).observe(ph,{attributes:true,attributeFilter:['class']}); }catch(e){}
  window.addEventListener('storage', function(e){ if (e.key==='xinhuo-theme') apply(); });
})();

// ================= 工具 =================
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.add('hidden'); },1800); }
function copy(text, msg){
  function ok(){ toast(msg||'已复制，可以直接粘贴给客户'); }
  function fb(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('复制失败，请手动复制'); } ta.remove(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}
function shortUrl(u){ var m=String(u).match(/^https?:\/\/([^\/?#]+)(.*)$/); if (!m) return u; var host=m[1].replace(/^www\./,''), rest=m[2]; return host+(rest.length>1?(rest.length>18?rest.slice(0,16)+'…':rest):''); }
function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<>"]+)/g,function(u){ return '<a href="'+u+'" target="_blank" rel="noopener" title="'+u+'">'+esc(shortUrl(u.replace(/&amp;/g,'&')))+'</a>'; }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ================= 接口（用职员端的登录状态） =================
var API='/api', TOKEN=lsGet('access_token');
function refresh(){
  var r=lsGet('refresh_token');
  if (!r) return Promise.reject(Object.assign(new Error('登录已过期，请刷新页面重新登录'),{status:401}));
  return fetch(API+'/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:r})})
    .then(function(x){ if(!x.ok) throw Object.assign(new Error('登录已过期，请刷新页面重新登录'),{status:401}); return x.json(); })
    .then(function(d){ lsSet('access_token',d.access); TOKEN=d.access; return d.access; });
}
function call(path, opts){
  opts=opts||{};
  function go(){ var h=Object.assign({}, opts.headers||{}, {Authorization:'Bearer '+TOKEN}); return fetch(API+path, Object.assign({}, opts, {headers:h})); }
  return go().then(function(res){ return res.status===401 ? refresh().then(go) : res; })
    .then(function(res){
      if (res.status===204) return null;
      return res.json().catch(function(){ return {}; }).then(function(j){
        if (!res.ok){ var e=new Error(j.detail || ('请求失败（'+res.status+'）')); e.status=res.status; throw e; }
        return j;
      });
    });
}
function send(method, path, body){ return call(path,{method:method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); }

// 按首字母排序：英文取第一个字母，汉字按拼音取首字母（A-Z），同一个字母里再按拼音/字母顺序
var PY_COLL = (function(){ try{ return new Intl.Collator('zh-Hans-CN-u-co-pinyin',{sensitivity:'base',numeric:true}); }catch(e){ return null; } })();
var PY_BOUND = '阿芭擦搭蛾发噶哈击喀垃妈拿哦啪期然撒塌挖昔压匝', PY_LET = 'ABCDEFGHJKLMNOPQRSTWXYZ';
function firstLetter(name){
  var c = String(name||'').trim().charAt(0);
  if (/[a-z]/i.test(c)) return c.toUpperCase();
  if (/[0-9]/.test(c)) return '#';
  if (PY_COLL && /[一-鿿]/.test(c)){
    var L='#';
    for (var i=0;i<PY_BOUND.length;i++){ if (PY_COLL.compare(c, PY_BOUND.charAt(i))>=0) L=PY_LET.charAt(i); else break; }
    return L;
  }
  return '#';
}
function byLetter(a, b){
  var la=firstLetter(a), lb=firstLetter(b);
  if (la!==lb) return la==='#' ? 1 : lb==='#' ? -1 : (la<lb?-1:1);
  return PY_COLL ? PY_COLL.compare(a,b) : String(a).localeCompare(String(b));
}

// ================= 状态 =================
// 这一页只能看和复制；新增、编辑、删除在管理后台「教程+话术」（/admin/knowledge）
var KINDS=[['faq','问答'],['tutorial','教程'],['phrase','快捷语']];
var KLABEL={faq:'问答', tutorial:'教程', phrase:'快捷语'};
var S={platforms:[], entries:[], canEdit:false, canDelete:false, pid:null, kind:'faq', pq:'', q:''};
var PMAP={};
function pname(id){ return id==null ? '通用' : (PMAP[id]?PMAP[id].name:'（已删除的平台）'); }
function entriesOf(pid, kind){ return S.entries.filter(function(e){ return e.platform_id===pid && (!kind || e.kind===kind); }); }
function countOf(pid){ return entriesOf(pid).length; }
function byId(id){ return S.entries.filter(function(x){ return x.id===id; })[0]; }
function attOf(e){ return (e.tutorials||[]).map(byId).filter(function(t){ return t && t.kind==='tutorial'; }); }
function textOf(e){
  if (e.kind==='tutorial') return e.title+'\n🔗 '+e.url;
  var s=(e.content||'').trim(), a=attOf(e);
  if (a.length) s+='\n\n'+a.map(function(t){ return t.title+'\n🔗 '+t.url; }).join('\n');
  return s;
}
function usedBy(t){ return S.entries.filter(function(e){ return (e.tutorials||[]).indexOf(t.id)>=0; }).length; }
var OPEN={};

// 地址栏：#/p/平台ID（0=通用）/类型
function readHash(){
  var m=(location.hash||'').match(/#\/p\/(\d+)(?:\/(faq|tutorial|phrase))?/);
  if (m){ var id=+m[1]; S.pid = id===0 ? null : id; if (m[2]) S.kind=m[2]; return true; }
  return false;
}
function writeHash(){ var h='#/p/'+(S.pid==null?0:S.pid)+'/'+S.kind; if (location.hash!==h){ try{ history.replaceState(null,'',h); }catch(e){} } lsSet('xh_kb_last', (S.pid==null?0:S.pid)+'/'+S.kind); }

// ================= 渲染 =================
function render(){
  $('qx').classList.toggle('hidden', !S.q);
  var side='<nav class="card side" aria-label="平台"><input id="pq" placeholder="找平台…" value="'+esc(S.pq)+'" autocomplete="off"><div class="plist" id="plist">'+platList()+'</div></nav>';
  $('app').innerHTML='<div class="lay">'+side+'<div class="main">'+(S.q.trim()?searchView():platView())+'</div></div>';
  var on=document.querySelector('.plist .on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'nearest'});
}
function platList(){
  var q=S.pq.trim().toLowerCase();
  function btn(id, name, status){
    var n=countOf(id), on=!S.q.trim() && S.pid===id;
    return '<button class="'+(on?'on':'')+(n?'':' none')+'" data-pid="'+(id==null?'':id)+'">'+esc(name)+(status==='off_sale'?' <span class="off">禁售</span>':'')+'<small>'+(n||'')+'</small></button>';
  }
  var h='';
  if (!q || '通用'.indexOf(q)>=0) h+=btn(null,'通用（所有平台）');
  // 平台按首字母 A-Z 排一列（没有内容的显示成灰色）
  h+=S.platforms.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>=0; }).map(function(p){ return btn(p.id,p.name,p.status); }).join('');
  return h || '<div class="sub" style="padding:8px">没有这个平台</div>';
}
function itemHtml(e, opt){
  opt=opt||{};
  var q=opt.q||'', hl=function(t){ return q?highlight(t,q):esc(t); };
  var meta=(e.updated_by?e.updated_by+' · ':'')+(e.updated_at?fmt(e.updated_at):'');
  var where = '<span class="pf">'+esc(pname(e.platform_id))+'</span>';
  var kp = opt.showKind ? '<span class="pill k-'+e.kind+'">'+KLABEL[e.kind]+'</span>' : '';
  if (e.kind==='tutorial'){
    var n=usedBy(e);
    return '<div class="card it tut"><div class="hd">'+kp+'<div class="q">📄 '+hl(e.title)+'</div>'+where+'</div>'
      + (e.content?'<div class="desc">'+hl(e.content)+'</div>':'')
      + '<div class="url" title="'+esc(e.url)+'">🔗 '+esc(shortUrl(e.url))+'</div>'
      + '<div class="ft"><span class="spacer"></span><button class="btn sm primary" data-copy="'+e.id+'">复制</button></div></div>';
  }
  var body='<div class="body">'+(q?highlight(e.content,q):linkify(e.content))+'</div>';
  var att=attOf(e), atth = att.length ? '<div class="att"><span class="lb">附带教程</span>'+att.map(function(t){ return '<a href="'+esc(t.url)+'" target="_blank" rel="noopener" title="'+esc(t.url)+'">📄 '+esc(t.title)+'</a>'; }).join('')+'</div>' : '';
  var copyLabel = e.kind==='faq' ? '复制答案' : '复制';
  var copyTip = att.length ? '<span class="used">复制时会带上 '+att.length+' 个教程链接</span>' : '';
  if (e.kind==='faq'){
    return '<div class="card it faq"><div class="hd">'+kp+'<div class="q"><span class="qm">问</span>'+hl(e.title)+'</div>'+where+'</div>'
      + body + atth
      + '<div class="ft">'+copyTip+'<span class="meta">'+esc(meta)+'</span><span class="spacer"></span><button class="btn sm primary" data-copy="'+e.id+'">'+copyLabel+'</button></div></div>';
  }
  return '<div class="card it phr"><div class="hd">'+kp+'<div class="q" style="font-size:14px">💬 '+hl(e.title)+'</div>'+where+'</div>'
    + body + atth
    + '<div class="ft">'+copyTip+'<span class="meta">'+esc(meta)+'</span><span class="spacer"></span><button class="btn sm primary" data-copy="'+e.id+'">'+copyLabel+'</button></div></div>';
}
function fmt(ms){ var d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function platView(){
  var p=S.pid==null?null:PMAP[S.pid];
  var name=pname(S.pid);
  var h='<section class="card ph"><div class="tt"><h2>'+esc(name)+'</h2>'+(p&&p.status==='off_sale'?'<span class="pill" style="background:var(--red-soft);color:var(--red)">禁售</span>':'')+(S.pid==null?'<span class="sub">所有平台都适用的内容，比如下单多久、能不能退款</span>':'')+'</div>'
    + '<div class="tabs" role="tablist">'+KINDS.map(function(k){ return '<button class="tab'+(S.kind===k[0]?' on':'')+'" role="tab" aria-selected="'+(S.kind===k[0])+'" data-kind="'+k[0]+'">'+k[1]+' <b>'+entriesOf(S.pid,k[0]).length+'</b></button>'; }).join('')+'</div></section>';
  var list=entriesOf(S.pid, S.kind);
  if (!list.length){
    h+='<section class="card empty">'+esc(name)+' 还没有'+KLABEL[S.kind]+'</section>';
  } else if (S.kind==='tutorial'){
    h+='<div class="tgrid">'+list.map(function(e){ return itemHtml(e); }).join('')+'</div>';
  } else {
    h+='<div class="list">'+list.map(function(e){ return itemHtml(e); }).join('')+'</div>';
  }
  return h;
}
function norm(s){ return String(s||'').toLowerCase(); }
function terms(q){ return norm(q).split(/[\s,，、]+/).filter(Boolean); }
function highlight(t,q){
  var h=esc(t);
  terms(q).sort(function(a,b){ return b.length-a.length; }).forEach(function(w){ var e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); h=h.replace(new RegExp('('+e+')','ig'),'<mark>$1</mark>'); });
  return h;
}
function searchView(){
  var ts=terms(S.q), res=[];
  S.entries.forEach(function(e){
    var hay=norm(e.title+' '+e.content+' '+e.url+' '+pname(e.platform_id)), titleHay=norm(e.title+' '+pname(e.platform_id));
    if (!ts.every(function(t){ return hay.indexOf(t)>=0; })) return;
    var sc=ts.reduce(function(a,t){ return a+(titleHay.indexOf(t)>=0?3:1); },0);
    res.push({e:e, s:sc});
  });
  res.sort(function(a,b){ return b.s-a.s; });
  var h='<section class="card ph"><div class="tt"><h2>搜索「'+esc(S.q.trim())+'」</h2><span class="sub">所有平台里找到 '+res.length+' 条</span></div></section>';
  if (!res.length) return h+'<section class="card empty">没有找到'+(S.canEdit?'<button class="btn primary" data-add="1">＋ 把它加成问答</button>':'')+'</section>';
  return h+'<div class="list">'+res.slice(0,100).map(function(r){ return itemHtml(r.e,{q:S.q,showPlat:true,showKind:true}); }).join('')+'</div>';
}

// ================= 事件 =================
document.addEventListener('click', function(ev){
  var t=ev.target.closest('button'); if (!t || t.disabled) return; var d=t.dataset;
  if (d.pid!==undefined){ S.pid = d.pid==='' ? null : +d.pid; if (S.q){ S.q=''; $('q').value=''; } writeHash(); render(); window.scrollTo({top:0}); }
  else if (d.kind){ S.kind=d.kind; writeHash(); render(); }
  else if (d.copy){ var e=S.entries.filter(function(x){ return x.id===+d.copy; })[0]; if (e) copy(textOf(e)); }
  else if (d.copyall){ var list=entriesOf(S.pid,'tutorial'); copy(pname(S.pid)+' 相关教程：\n'+list.map(function(e,i){ return (i+1)+'. '+textOf(e); }).join('\n'), '已复制 '+list.length+' 篇教程'); }
  else if (d.more){ OPEN[+d.more]=!OPEN[+d.more]; render(); }
  else if (t.id==='qx'){ S.q=''; $('q').value=''; render(); $('q').focus(); }
});
document.addEventListener('input', function(ev){
  var t=ev.target;
  if (t.id==='q'){ S.q=t.value; render(); }
  else if (t.id==='pq'){ S.pq=t.value; $('plist').innerHTML=platList(); }
});

// ================= 启动 =================
call('/knowledge/').then(function(d){
  S.platforms=d.platforms||[]; S.entries=d.entries||[]; S.canEdit=!!d.can_edit; S.canDelete=!!d.can_delete;
  S.platforms.sort(function(x,y){ return byLetter(x.name, y.name); });
  S.platforms.forEach(function(p){ PMAP[p.id]=p; });
  if (!readHash()){
    var last=lsGet('xh_kb_last');
    if (last){ var a=last.split('/'); S.pid = +a[0] ? +a[0] : null; if (a[1]) S.kind=a[1]; }
    else { var first=S.platforms.filter(function(p){ return countOf(p.id); })[0]; S.pid = first?first.id:null; }
  }
  if (S.pid!=null && !PMAP[S.pid]) S.pid=null;
  // 打开的类型没有内容时，换到这个平台第一个有内容的类型（问答 → 教程 → 快捷语）
  if (!entriesOf(S.pid, S.kind).length){ var hit=KINDS.filter(function(k){ return entriesOf(S.pid,k[0]).length; })[0]; if (hit) S.kind=hit[0]; }
  writeHash(); render();
}).catch(function(err){
  $('app').innerHTML='<div class="card notice">'+esc(err.status===401?'登录已过期，请刷新页面重新登录':'加载失败：'+err.message)+'</div>';
});
window.addEventListener('hashchange', function(){ if (readHash()) render(); });
</script>
</body>

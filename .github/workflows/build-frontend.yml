name: 打包职员端

# 职员端（frontend/）有改动推到 main 时，在 GitHub 的机器上打包，
# 打好的文件发布到 frontend-dist 分支；服务器用 scripts/deploy_frontend.sh 拉取替换，
# 不在服务器上打包（服务器内存小，打包会拖垮线上服务）。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: 打包
        working-directory: frontend
        env:
          VITE_USE_BUNDLE_ANALYZER: "false"
        run: pnpm run build:pro

      - name: 发布到 frontend-dist 分支
        working-directory: frontend/dist-pro
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          test -f index.html
          echo "${GITHUB_SHA}" > BUILD_COMMIT
          git init -q -b frontend-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "职员端打包 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" frontend-dist
